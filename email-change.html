<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Chepeti — Скасувати зміну пошти</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 720px; margin: 0 auto; padding: 40px 24px; color: #1a1a1a; line-height: 1.7; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { font-size: 16px; color: #333; }
    a { color: #5E7E6B; }
    .box { background: #F4F1EA; border-radius: 12px; padding: 20px 24px; margin: 24px 0; }
    button { background: #5E7E6B; color: #fff; border: 0; border-radius: 12px; padding: 14px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <!-- Посилання з листа «запит на зміну пошти» (функція adminEmailChange). Скасовує лише кнопка: поштові сканери самі
       відкривають посилання, і відкриття сторінки нічого не змінює. У адресі лише одноразовий ключ. -->
  <h1 id="t"></h1>
  <p id="lead"></p>
  <div class="box"><p id="msg" style="margin:0"></p></div>
  <button id="go"></button>
  <p style="margin-top:32px"><a href="mailto:support@chepeti.com">support@chepeti.com</a></p>
<script>
const q = new URLSearchParams(location.search), k = q.get('k') || '', en = q.get('l') === 'en';
const T = en ? {
  t: 'Cancel the email change', lead: 'We were asked to change the email of your Chepeti account. If it was not you, cancel it here: the account will stay on your current address.',
  msg: 'Press the button to cancel. Nothing changes until you do.', go: 'Cancel the change', busy: 'Cancelling…',
  ok: 'Cancelled. Your account stays on your current address. Thank you — we will look into who asked for the change.',
  done: 'Too late: the email has already been changed. Write to support@chepeti.com from this address and we will help.',
  cancelled: 'This change has already been cancelled. Nothing else to do.', bad: 'This link is not valid. Copy it from the email in full, or write to support@chepeti.com.',
  err: 'Could not cancel right now. Try again in a few minutes, or write to support@chepeti.com.',
} : {
  t: 'Скасувати зміну пошти', lead: 'Нас попросили змінити пошту вашого акаунта Chepeti. Якщо це були не ви, скасуйте тут: акаунт лишиться на вашій теперішній адресі.',
  msg: 'Натисніть кнопку, щоб скасувати. Доки не натиснете, нічого не зміниться.', go: 'Скасувати зміну', busy: 'Скасовую…',
  ok: 'Скасовано. Акаунт лишається на вашій теперішній адресі. Дякуємо: ми розберемось, хто просив зміну.',
  done: 'Запізно: пошту вже змінено. Напишіть на support@chepeti.com з цієї адреси, і ми допоможемо.',
  cancelled: 'Цю зміну вже скасовано. Більше нічого робити не треба.', bad: 'Посилання недійсне. Скопіюйте його з листа повністю або напишіть на support@chepeti.com.',
  err: 'Зараз не вдалося скасувати. Спробуйте за кілька хвилин або напишіть на support@chepeti.com.',
};
document.documentElement.lang = en ? 'en' : 'uk';
document.title = 'Chepeti — ' + T.t;
for (const id of ['t', 'lead', 'msg', 'go']) document.getElementById(id).textContent = T[id];
const go = document.getElementById('go'), msg = document.getElementById('msg');
if (!/^[\w-]{32}$/.test(k)) { msg.textContent = T.bad; go.hidden = true; }
go.onclick = async () => {
  go.disabled = true; go.textContent = T.busy;
  try {
    const r = await fetch('https://europe-central2-chepeti-c8fb9.cloudfunctions.net/cancelEmailChange', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: { k } }) });
    const res = (await r.json()).result?.result;
    msg.textContent = T[res] || T.err;
    if (res) go.hidden = true;
  } catch { msg.textContent = T.err; }
  go.disabled = false; go.textContent = T.go;
};
</script>
</body>
</html>
